name: verify-publications
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y minisign
      - name: Verify publication contract tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify all released papers and signatures
        run: python3 tools/verify_papers.py --all
